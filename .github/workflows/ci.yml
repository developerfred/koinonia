# Koinonia CI: per-component gates + cross-component QA. Local equivalent: `make qa` (see qa/README.md).
# Docs deployment lives in pages.yml (not touched here).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: long soak + coverage-guided fuzz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0
  NODE_VERSION: 24
  QA_STRICT: "1"            # a skipped gate is a failure in CI
  FORCE_COLOR: "0"

jobs:
  # ------------------------------------------------------------------ daemon (Zig)
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: zig fmt --check
        working-directory: daemon
        run: zig fmt --check src build.zig build.zig.zon
      - name: zig build test
        working-directory: daemon
        run: zig build test --summary all
      - name: build (Debug + ReleaseSafe)
        working-directory: daemon
        run: |
          zig build --summary all
          zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/rs"
      - name: Cross-compile smoke (linux, macos, windows)
        working-directory: daemon
        run: |
          for t in x86_64-linux aarch64-linux aarch64-macos x86_64-windows; do
            zig build -Dtarget=$t -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/x-$t"
          done
      - uses: actions/upload-artifact@v4
        with: { name: koinonia-d-linux, path: "${{ runner.temp }}/rs/bin/koinonia-d" }

  # ------------------------------------------------------------------ TypeScript components
  ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [tokens, studio, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ${{ matrix.component }}/package-lock.json
            qa/package-lock.json
      - name: install component + qa tooling
        run: |
          [ -f ${{ matrix.component }}/package.json ] || { echo "::error::${{ matrix.component }} missing"; exit 1; }
          npm --prefix ${{ matrix.component }} ci --no-audit --no-fund || npm --prefix ${{ matrix.component }} install --no-audit --no-fund
          npm --prefix qa ci --no-audit --no-fund
      - name: typecheck + vitest with coverage thresholds (qa/coverage-thresholds.json)
        run: node qa/tools/gates.mjs --only ${{ matrix.component }}:typecheck,${{ matrix.component }}:test
      - name: build
        if: matrix.component == 'studio'
        run: node qa/tools/gates.mjs --only studio:build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-${{ matrix.component }}, path: qa/.out/coverage/${{ matrix.component }}, if-no-files-found: ignore }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm --prefix qa ci --no-audit --no-fund
      - run: node qa/tools/gates.mjs --only qa:selftest-tooling,qa:fixtures-fresh,lint:ts

  # ------------------------------------------------------------------ site
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            qa/package-lock.json
      - run: npm --prefix site ci --no-audit --no-fund
      - run: npm --prefix qa ci --no-audit --no-fund
      - run: npx --prefix qa playwright install --with-deps chromium
      - name: build, link check, axe (WCAG A/AA, light+dark)
        run: node qa/tools/gates.mjs --only site:build,site:quality
        env: { QA_SITE_BUILD: "1" }
      - name: Lighthouse CI
        run: |
          npm --prefix qa exec -- npx --yes @lhci/cli@0.14.0 autorun --config=qa/lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: qa/.out/lhci, if-no-files-found: ignore }

  # ------------------------------------------------------------------ cross-component QA
  contract-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm --prefix qa ci --no-audit --no-fund
      - name: golden contract (reference codec, studio, Zig parser) + property tests + token-economy evals
        run: node qa/tools/gates.mjs --only contract,qa:zig-conformance+fuzz,properties,evals:token-economy
        env: { QA_ZIG_FUZZ_ITERS: "300000" }

  integration:
    runs-on: ubuntu-latest
    needs: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm --prefix qa ci --no-audit --no-fund
      - name: daemon <-> fake RTMP sinks, stream-key log test, black-box fuzz, soak smoke
        run: node qa/tools/gates.mjs --only daemon:build,integration,security:tests,fuzz,soak:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-logs, path: qa/.out/logs }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            qa/package-lock.json
      - run: npm --prefix studio ci --no-audit --no-fund
      - run: npm --prefix qa ci --no-audit --no-fund
      - run: npx --prefix qa playwright install --with-deps chromium
      - name: Playwright (Chromium, fake media devices, WebMCP polyfill)
        run: xvfb-run -a node qa/tools/gates.mjs --only e2e:playwright
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "qa/playwright-report\nqa/test-results", if-no-files-found: ignore }

  # ------------------------------------------------------------------ security
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # gitleaks scans history
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact -v -c .gitleaks.toml
      - name: npm audit (high/critical) for every package + zig dependency report
        run: node qa/tools/gates.mjs --only security:audit,security:zig-deps

  # ------------------------------------------------------------------ nightly
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm --prefix qa ci --no-audit --no-fund
      - run: node qa/tools/gates.mjs --only daemon:build
      - name: 10 minute soak
        run: npx --prefix qa tsx qa/soak/soak.ts --profile full
        working-directory: qa
      - name: long black-box fuzz + 5M-iteration Zig fuzz
        run: |
          QA_FUZZ_ITERS=3000 npx vitest run fuzz
          cd zig && zig build test -Dfuzz-iters=5000000
        working-directory: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly, path: qa/.out/soak.json, if-no-files-found: ignore }
