<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Koinonia Estúdio</title>
<script>
  /* Aplica preferências visuais antes da primeira pintura (evita troca de tema/tamanho no carregamento). */
  try {
    var p = JSON.parse(localStorage.getItem("koinonia.studio.prefs.v1") || "null") || {}, h = document.documentElement;
    if (p.theme === "light" || p.theme === "dark") h.dataset.theme = p.theme;
    if (p.contrast === "high") h.dataset.contrast = "high";
    if (p.density) h.dataset.density = p.density;
    if (typeof p.fontScale === "number") h.style.setProperty("--fs", String(p.fontScale));
    h.dataset.view = p.view === "painel" ? "painel" : "foco";
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>O Koinonia Estúdio precisa de JavaScript para funcionar.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
